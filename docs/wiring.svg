<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><style>text{font-family:system-ui,sans-serif;fill:#d9e5ed;font-size:16px}.small{font-size:13px;fill:#9db3c1}.title{font-size:22px;fill:#63d9d1}.box{fill:#182936;stroke:#3b5667;stroke-width:1.5}.power{stroke:#eba06a;stroke-width:3;fill:none}.logic{stroke:#63d9d1;stroke-width:2;fill:none}.ground{stroke:#8299ad;stroke-width:2;fill:none}</style></defs><rect width="1100" height="620" fill="#0d1923"/><text x="35" y="40" class="title">24 V motor bus · 3.3 V logic · common ground</text><rect class="box" x="35" y="83" width="165" height="85" rx="6"/><text x="52" y="115">24 V DC supply</text><text x="52" y="141" class="small">External enclosed PSU</text><rect class="box" x="235" y="83" width="90" height="85" rx="6"/><text x="258" y="118">Fuse</text><text x="251" y="143" class="small">size to load</text><rect class="box" x="365" y="83" width="155" height="85" rx="6"/><text x="380" y="115">E-stop + guard</text><text x="380" y="141" class="small">NC · DC-rated poles</text><path class="power" d="M200 110H235M325 110H365M520 110H720V195M720 110H940V195"/><text x="560" y="97" class="small">switched +24 V</text><rect class="box" x="630" y="195" width="180" height="125" rx="6"/><rect class="box" x="850" y="195" width="180" height="125" rx="6"/><text x="650" y="223">DRV8825 #1</text><text x="650" y="250" class="small">Drive STEP / DIR</text><text x="650" y="273" class="small">100 µF / 50 V</text><text x="650" y="295" class="small">across VMOT &amp; GND</text><text x="870" y="223">DRV8825 #2</text><text x="870" y="250" class="small">Take-up STEP / DIR</text><text x="870" y="273" class="small">100 µF / 50 V</text><text x="870" y="295" class="small">across VMOT &amp; GND</text><path class="power" d="M720 320V350M940 320V350"/><rect class="box" x="630" y="350" width="180" height="65" rx="6"/><rect class="box" x="850" y="350" width="180" height="65" rx="6"/><text x="650" y="378">Drive NEMA17</text><text x="650" y="399" class="small">A pair + B pair</text><text x="870" y="378">Take-up NEMA17</text><text x="870" y="399" class="small">A pair + B pair</text><path class="power" d="M345 110V188H216V241H200"/><rect class="box" x="35" y="206" width="165" height="75" rx="6"/><text x="52" y="236">24 V → 5 V buck</text><text x="52" y="262" class="small">Unswitched logic power</text><path class="power" d="M117 281V320H205"/><text x="126" y="306" class="small">5 V only</text><rect class="box" x="205" y="292" width="235" height="155" rx="6"/><text x="227" y="324" class="title">ESP32-WROOM</text><text x="227" y="352" class="small">25 / 26 → drive STEP / DIR</text><text x="227" y="376" class="small">27 / 14 → take-up STEP / DIR</text><text x="227" y="400" class="small">13 → both nEN · 10k pull-up</text><text x="227" y="425" class="small">34 / 35 → isolated NC senses</text><path class="logic" d="M440 350H545V245H630M440 375H575V175H860V245"/><text x="465" y="339" class="small">3.3 V logic</text><path class="ground" d="M117 168V183H25V482H1060V305H1030M440 435H475V482M810 305H826V482M200 260H216V482"/><text x="680" y="475" class="small">COMMON GND — route motor returns separately</text><text x="35" y="531">GPIO34 / 35 each: 10 kΩ to 3.3 V; separate NC switch pole to GND.</text><text x="35" y="557" class="small">No 24 V on GPIO. Physical stop interrupts motor power; firmware latches its sense input.</text><text x="35" y="580" class="small">Both drivers: RESET + SLEEP + MODE0 + MODE1 → 3.3 V; MODE2 → GND (1/8 step).</text><text x="35" y="604" class="small">Set current limit before operation. Use USB or external board power unless safe isolation is provided.</text></svg>
